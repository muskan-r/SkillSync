<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5C7"/>
      <stop offset="100%" stop-color="#00A88F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="48" fill="#0A0E14"/>

  <!-- Two orbiting nodes forming an "S" / sync motif -->
  <circle cx="82" cy="82" r="26" fill="url(#tealGrad)"/>
  <circle cx="158" cy="158" r="26" fill="url(#tealGrad)"/>

  <!-- Connecting sync path -->
  <path
    d="M 82 108
       C 82 150, 158 90, 158 132"
    stroke="url(#tealGrad)"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Small accent dots (sync pulses) -->
  <circle cx="120" cy="120" r="6" fill="#7C8CFF"/>
  <circle cx="60" cy="150" r="4" fill="#7C8CFF" opacity="0.6"/>
  <circle cx="180" cy="90" r="4" fill="#7C8CFF" opacity="0.6"/>
</svg>
